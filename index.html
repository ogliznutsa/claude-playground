<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Playground</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171b22;
      --panel-2: #1f242d;
      --text: #e8ecf1;
      --muted: #8b94a3;
      --accent: #6c8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2030, var(--bg));
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px 16px;
    }
    .wrap { width: 100%; max-width: 760px; }
    header { text-align: center; margin-bottom: 36px; }
    h1 { font-size: 34px; margin: 0; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); margin-top: 8px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
      border: 1px solid #262c36;
      border-radius: 18px;
      padding: 28px 24px;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }
    .card__emoji { font-size: 44px; display: block; margin-bottom: 14px; }
    .card__title { font-size: 21px; font-weight: 600; margin: 0 0 6px; }
    .card__desc { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>🛝 Claude Playground</h1>
      <p class="subtitle">Маленькие проекты, собранные с Claude Code</p>
    </header>

    <div class="cards">
      <a class="card" href="./tic-tac-toe/">
        <span class="card__emoji">⭕️❌</span>
        <h2 class="card__title">Крестики-нолики</h2>
        <p class="card__desc">Классическая игра на поле 3×3. Играй вдвоём по очереди.</p>
      </a>

      <a class="card" href="./voice-fx/">
        <span class="card__emoji">🎙️</span>
        <h2 class="card__title">Voice FX</h2>
        <p class="card__desc">Запиши голос и наложи эффекты: робот, бобёр, эхо, рация и другие.</p>
      </a>
    </div>
  </main>
</body>
</html>
